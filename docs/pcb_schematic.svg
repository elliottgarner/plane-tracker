<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 660" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="1010" height="660" fill="#fff"/>
  <text x="505" y="26" text-anchor="middle" font-size="18" font-weight="bold">Plane Tracker carrier board - power + sensor breakout (reference schematic)</text>

  <!-- ===== 12V input ===== -->
  <rect x="30" y="250" width="120" height="70" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="90" y="272" text-anchor="middle" font-weight="bold">J1</text>
  <text x="90" y="288" text-anchor="middle">12 V DC barrel jack</text>
  <text x="90" y="304" text-anchor="middle">centre-pin = +</text>
  <line x1="150" y1="285" x2="190" y2="285" stroke="#c00" stroke-width="2.5"/>
  <rect x="190" y="270" width="80" height="30" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="230" y="289" text-anchor="middle">F1 2 A</text>
  <line x1="270" y1="285" x2="300" y2="285" stroke="#c00" stroke-width="2.5"/>
  <text x="170" y="274" fill="#c00" text-anchor="middle">+12V</text>
  <line x1="300" y1="180" x2="300" y2="410" stroke="#c00" stroke-width="2.5"/>
  <circle cx="300" cy="285" r="4" fill="#c00"/>
  <text x="283" y="254" fill="#c00" text-anchor="end">+12V_F</text>
  <line x1="300" y1="180" x2="330" y2="180" stroke="#c00" stroke-width="2.5"/>
  <line x1="300" y1="410" x2="330" y2="410" stroke="#c00" stroke-width="2.5"/>
  <!-- optional protection -->
  <text x="190" y="336" font-size="11" fill="#555">Optional: D1 reverse-polarity P-FET or</text>
  <text x="190" y="350" font-size="11" fill="#555">Schottky, TVS (SMBJ15A), 100 uF bulk cap</text>
  <!-- J1 ground -->
  <line x1="90" y1="320" x2="90" y2="600" stroke="#000" stroke-width="2.5"/>

  <!-- ===== buck A (Pi) ===== -->
  <rect x="330" y="150" width="150" height="90" fill="#eef5ff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="172" text-anchor="middle" font-weight="bold">U1 buck module</text>
  <text x="405" y="190" text-anchor="middle">Pi supply</text>
  <text x="405" y="208" text-anchor="middle">trim to 5.17 V</text>
  <text x="405" y="226" text-anchor="middle" font-size="11">IN+ / GND / OUT+ (EN open)</text>
  <line x1="480" y1="180" x2="560" y2="180" stroke="#e08000" stroke-width="2.5"/>
  <text x="520" y="172" text-anchor="middle" fill="#e08000">+5V_PI</text>

  <!-- ===== buck B (display) ===== -->
  <rect x="330" y="380" width="150" height="90" fill="#eef5ff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="402" text-anchor="middle" font-weight="bold">U2 buck module</text>
  <text x="405" y="420" text-anchor="middle">Display supply</text>
  <text x="405" y="438" text-anchor="middle">trim to 5.0 V</text>
  <text x="405" y="456" text-anchor="middle" font-size="11">IN+ / GND / OUT+ (EN open)</text>
  <line x1="480" y1="410" x2="540" y2="410" stroke="#e08000" stroke-width="2.5"/>
  <text x="510" y="402" text-anchor="middle" fill="#e08000">+5V_DISP</text>

  <!-- ===== J2 to Pi ===== -->
  <rect x="560" y="158" width="130" height="44" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="625" y="177" text-anchor="middle" font-weight="bold">J2 (2-pin / USB-C)</text>
  <text x="625" y="193" text-anchor="middle" font-size="11">cable to Pi USB-C power</text>

  <!-- ===== optional relay + J3 ===== -->
  <rect x="540" y="388" width="90" height="44" fill="#fff7e8" stroke="#000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="585" y="406" text-anchor="middle" font-weight="bold">K1 relay</text>
  <text x="585" y="422" text-anchor="middle" font-size="11">NO contact (optional)</text>
  <line x1="630" y1="410" x2="660" y2="410" stroke="#e08000" stroke-width="2.5"/>
  <rect x="660" y="388" width="80" height="44" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="700" y="407" text-anchor="middle" font-weight="bold">J3 2-pin</text>
  <text x="700" y="423" text-anchor="middle" font-size="11">display 5 V</text>
  <text x="585" y="450" text-anchor="middle" font-size="11" fill="#555">bypass K1 with a solder jumper if unused</text>

  <!-- ===== ground bus ===== -->
  <line x1="90" y1="600" x2="990" y2="600" stroke="#000" stroke-width="3"/>
  <text x="95" y="618" font-weight="bold">GND - one ground plane. U1, U2, J1, Pi header, PIR, encoder and relay are all bonded here.</text>
  <line x1="480" y1="225" x2="505" y2="225" stroke="#000" stroke-width="2.5"/>
  <line x1="480" y1="455" x2="505" y2="455" stroke="#000" stroke-width="2.5"/>
  <line x1="505" y1="225" x2="505" y2="600" stroke="#000" stroke-width="2.5"/>
  <circle cx="505" cy="225" r="4"/><circle cx="505" cy="455" r="4"/><circle cx="505" cy="600" r="4"/><circle cx="90" cy="600" r="4"/>

  <!-- ===== Pi header J4 ===== -->
  <rect x="760" y="50" width="230" height="236" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="875" y="70" text-anchor="middle" font-weight="bold">J4 Pi 40-pin header (pins used)</text>
  <g font-size="11.5">
    <text x="772" y="94">pin 4   +5V      -&gt; PIR VCC</text>
    <text x="772" y="112">pin 6   GND</text>
    <text x="772" y="130">pin 8   GPIO14   &lt;- PIR OUT</text>
    <text x="772" y="148">pin 9   GND      (relay)</text>
    <text x="772" y="166">pin 13  GPIO27   &lt;- encoder SW</text>
    <text x="772" y="184">pin 14  GND      encoder</text>
    <text x="772" y="202">pin 15  GPIO22   &lt;- encoder CLK</text>
    <text x="772" y="220">pin 16  GPIO23   &lt;- encoder DT</text>
    <text x="772" y="238">pin 17  +3V3     -&gt; encoder +</text>
    <text x="772" y="256">pin 37  GPIO26   -&gt; relay IN</text>
    <text x="772" y="276" fill="#c00">Pi 5V pins and +5V_PI are NOT joined</text>
  </g>

  <!-- ===== PIR ===== -->
  <rect x="760" y="306" width="230" height="62" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="875" y="324" text-anchor="middle" font-weight="bold">J5 PIR (SR505) 1x3</text>
  <text x="772" y="343" font-size="11.5">1 VCC  = +5V (J4 pin 4)</text>
  <text x="772" y="358" font-size="11.5">2 OUT  = GPIO14 (pin 8)   3 GND</text>

  <!-- ===== encoder ===== -->
  <rect x="760" y="380" width="230" height="82" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="875" y="398" text-anchor="middle" font-weight="bold">J6 encoder HW-040 2x3 / 1x5</text>
  <text x="772" y="416" font-size="11.5">SW  = GPIO27 (pin 13)   GND</text>
  <text x="772" y="431" font-size="11.5">CLK = GPIO22 (pin 15)</text>
  <text x="772" y="446" font-size="11.5">DT  = GPIO23 (pin 16)   + = 3V3</text>
  <text x="772" y="458" font-size="10" fill="#555">add 100 nF CLK/DT to GND (optional debounce)</text>

  <!-- ===== relay driver ===== -->
  <rect x="760" y="476" width="230" height="104" fill="#fff7e8" stroke="#000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="875" y="494" text-anchor="middle" font-weight="bold">J7 relay driver (optional)</text>
  <text x="772" y="512" font-size="11.5">GPIO26 -&gt; 1 k -&gt; Q1 base (BC337)</text>
  <text x="772" y="527" font-size="11.5">Q1 emitter = GND, collector -&gt; K1 coil -</text>
  <text x="772" y="542" font-size="11.5">K1 coil + = +5V_PI, D2 across coil</text>
  <text x="772" y="557" font-size="11.5">or 3-pin header for a relay module</text>
  <text x="772" y="572" font-size="11.5">(VCC 5V, IN GPIO26, GND)</text>

  <!-- ===== legend ===== -->
  <g font-size="11">
    <line x1="30" y1="650" x2="60" y2="650" stroke="#c00" stroke-width="2.5"/><text x="66" y="654">12 V</text>
    <line x1="120" y1="650" x2="150" y2="650" stroke="#e08000" stroke-width="2.5"/><text x="156" y="654">5 V rails (kept separate)</text>
    <line x1="300" y1="650" x2="330" y2="650" stroke="#000" stroke-width="2.5"/><text x="336" y="654">GND (common)</text>
    <text x="450" y="654">Dashed = optional. Modules are 1x3 headers/pads for the buck boards, not discrete regulators.</text>
  </g>
</svg>
