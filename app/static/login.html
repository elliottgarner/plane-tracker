<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane Tracker · Login</title>
<link rel="icon" href="/static/favicon.svg">
<style>
  :root { --bg:#0a0e13; --panel:#10161d; --line:#232e3b; --text:#e8eef4; --dim:#7f8fa0; --amber:#ffb000; --red:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif; }
  form { width:min(340px,90vw); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; }
  h1 { margin:0 0 4px; font-size:20px; letter-spacing:.06em; color:var(--amber); }
  p { margin:0 0 16px; color:var(--dim); font-size:14px; }
  input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid #2c3948; background:#0b1117; color:var(--text); font:inherit; }
  input:focus { outline:2px solid #4fd1ff; }
  button { width:100%; margin-top:12px; padding:11px; border:0; border-radius:8px; background:var(--amber); color:#1b1200; font:700 16px inherit; cursor:pointer; }
  #err { color:var(--red); min-height:20px; margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<form id="f">
  <h1>✈ SETTINGS</h1>
  <p>Enter the settings password.</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus placeholder="Password">
  <button>Unlock</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.reload();
  else { const j = await r.json().catch(() => ({})); document.getElementById('err').textContent = j.detail || 'Login failed'; }
};
</script>
</body>
</html>
