<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane Tracker · Settings</title>
<link rel="icon" href="/static/favicon.svg">
<style>
  :root { --bg:#0a0e13; --panel:#10161d; --line:#232e3b; --text:#e8eef4; --dim:#7f8fa0; --amber:#ffb000; --cyan:#4fd1ff; --green:#46d17a; --red:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 90px; }
  h1 { font-size: 22px; letter-spacing: .06em; color: var(--amber); margin: 6px 0 4px; }
  p.lead { color: var(--dim); margin: 0 0 18px; }
  fieldset { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; margin: 0 0 16px; padding: 14px 16px 6px; }
  legend { padding: 0 8px; font-weight: 700; color: var(--cyan); letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
  .f { display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px; align-items: center; margin-bottom: 12px; }
  .f label { font-weight: 600; } .f small { display: block; color: var(--dim); font-weight: 400; font-size: 12px; }
  input, select, textarea { width: 100%; font-size: 13px; background: #0b1117; color: var(--text); border: 1px solid #2c3948; border-radius: 8px; padding: 9px 10px; font: inherit; }
  input[type=checkbox] { width: 22px; height: 22px; } input:focus, select:focus { outline: 2px solid var(--cyan); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(10,14,19,.96); border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; justify-content: center; align-items: center; }
  button { background: var(--amber); color: #1b1200; border: 0; border-radius: 8px; padding: 11px 22px; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  nav { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 14px; padding: 8px 16px; background: rgba(10,14,19,.96); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  nav a { flex: none; padding: 5px 12px; border: 1px solid #2c3948; border-radius: 999px; color: var(--text); text-decoration: none; font-size: 13px; }
  nav a:hover { border-color: var(--cyan); color: var(--cyan); }
  fieldset { scroll-margin-top: 56px; }
  #msg.dirty { color: var(--amber); }
  button.ghost { background: #1c2631; color: var(--text); border: 1px solid #2c3948; }
  #msg { min-width: 160px; font-weight: 600; } .ok { color: var(--green); } .err { color: var(--red); }
  a { color: var(--cyan); } .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  @media (max-width: 560px) { .f { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>✈ PLANE TRACKER SETTINGS</h1>
  <p class="lead">Changes apply instantly — no restart needed. <a href="/">← back to display</a> · <a href="/api/health">health</a></p>
  <nav id="nav"></nav>
  <form id="form" autocomplete="off"></form>
</main>
<div class="bar"><span id="msg"></span><button id="save">Save</button><button class="ghost" id="reload" type="button">Revert</button><button class="ghost" id="logout" type="button">Log out</button></div>

<script>
// any 401 (session expired / password changed) -> reload, which shows the login page
const _fetch = window.fetch;
window.fetch = async (...a) => { const r = await _fetch(...a); if (r.status === 401) location.reload(); return r; };
const SCHEMA = [
  ['Location', [
    ['home_lat', 'Home latitude', 'number', { step: 'any', help: 'Decimal degrees, e.g. 51.5074' }],
    ['home_lon', 'Home longitude', 'number', { step: 'any', help: 'Negative = west' }],
    ['home_elevation_m', 'Home elevation (m)', 'number', { step: 1, help: 'Used for the “look up” elevation angle' }],
    ['range_km', 'Detection range (km)', 'number', { step: 1, min: 5, max: 400, help: 'Aircraft beyond this are ignored (max 400)' }],
  ]],
  ['Display', [
    ['units', 'Units', 'select', { opts: [['imperial', 'Imperial (ft · mph · mi)'], ['nautical', 'Nautical / aviation (ft · kts · nm)'], ['metric', 'Metric (m · km/h · km)']] }],
    ['screen_rotation', 'Screen rotation', 'select', { opts: [['0', 'Normal (landscape)'], ['180', 'Upside down (landscape, flipped)'], ['90', 'Portrait, rotated 90° clockwise'], ['270', 'Portrait, rotated 270° clockwise']], help: 'Rotates the dashboard page; touch follows. Portrait stacks the map above the card' }],
    ['tile_style', 'Map style', 'select', { opts: [['dark', 'Dark Matter'], ['positron', 'Positron (light)'], ['osm', 'OpenStreetMap'], ['satellite', 'Satellite']] }],
    ['tile_url', 'Custom tile URL', 'text', { help: 'Optional. Overrides the style above (use {z}/{x}/{y}); needed for keyed providers' }],
    ['stats_page_seconds', 'Stats page time (s)', 'number', { step: 1 }],
    ['stats_screensaver.enabled', 'Late-night stats screensaver', 'checkbox', { help: 'Show stats when the sky is quiet' }],
    ['stats_screensaver.start_hour', 'Screensaver from (hour)', 'number', { step: 1, min: 0, max: 23 }],
    ['stats_screensaver.end_hour', 'Screensaver until (hour)', 'number', { step: 1, min: 0, max: 24 }],
  ]],
  ['Data source', [
    ['data_source', 'Source', 'select', { opts: [['local', 'Local SDR only'], ['auto', 'Auto (SDR, fall back to web)'], ['hybrid', 'Hybrid (SDR + web augment)'], ['web', 'Web API only'], ['demo', 'Demo traffic']] }],
    ['local_url', 'Local SDR URL / file', 'text', { help: 'readsb/dump1090 aircraft.json URL or file path' }],
    ['web_api_urls', 'Web API URLs (one per line)', 'lines', { help: 'Tried in order; rate-limited ones are rested. {lat} {lon} {radius_nm} are substituted. adsb.lol allows only 500 requests/day, keep it last' }],
    ['web_poll_seconds', 'Web poll interval (s)', 'number', { step: 1 }],
    ['lazy_route_lookup', 'Look up missing routes online', 'checkbox', { help: 'Only for the aircraft on screen; results are cached' }],
  ]],
  ['Tracking', [
    ['proximity_km', 'Closest-first strength (km)', 'number', { step: 1, help: 'Smaller = stronger preference for planes near home (default 12)' }],
    ['airport_filter', 'Ignore airport traffic', 'checkbox', { help: 'Planes taking off / landing / taxiing at nearby airports are not auto-selected (the map stays on home)' }],
    ['airport_zone_km', 'Airport zone radius (km)', 'number', { step: 1 }],
    ['airport_ceiling_ft', 'Airport zone ceiling (ft)', 'number', { step: 100, help: 'Below this altitude inside the zone counts as airport traffic' }],
    ['demote_helicopters', 'Demote helicopters', 'checkbox', { help: 'Police / air-ambulance helicopters rank low and time out quickly' }],
    ['heli_focus_seconds', 'Helicopter focus limit (s)', 'number', { step: 5 }],
    ['max_focus_seconds', 'Aircraft focus limit (s)', 'number', { step: 10, help: 'After this long on screen the display rotates to something else' }],
    ['dwell_seconds', 'Dwell time (s)', 'number', { step: 5, help: 'Minimum time before the focus may switch' }],
    ['interest_override', 'Promote interesting aircraft', 'checkbox', { help: 'Military, rare, emergency, low passes beat “closest”' }],
    ['low_alt_ft', 'Low-pass altitude (ft)', 'number', { step: 100 }],
    ['low_alt_radius_km', 'Low-pass radius (km)', 'number', { step: 1 }],
  ]],
  ['Controls', [
    ['hardware_mode', 'Hardware mode', 'select', { opts: [['touch', 'Touch only'], ['encoder', 'Rotary encoder (KY-040)'], ['toggle', '3-position toggle switch']] }],
    ['encoder_rotate_action', 'Encoder behaviour', 'select', { opts: [['zoom', 'Turn: zoom · Click: lock plane'], ['cycle', 'Turn: change plane · Click: lock plane'], ['hybrid', 'Hybrid — Turn: zoom · Click: change plane']], help: 'Long-press always switches between map and stats' }],
    ['long_press_seconds', 'Long-press time (s)', 'number', { step: 0.1 }],
    ['location_hold_seconds', 'Location-switch hold (s, 0 = off)', 'number', { step: 1, min: 0, max: 60, help: 'Hold the encoder button this long to jump to the next saved location' }],
  ]],
  ['Presence sensor & screen sleep', [
    ['pir_enabled', 'Use PIR sensor', 'checkbox', {}],
    ['pir_gpio', 'PIR sensor GPIO (BCM number)', 'number', { step: 1, min: 0, max: 40, help: 'Default 14 (physical pin 8); changes apply immediately' }],
    ['pir_timeout_min', 'Screen off after no motion (min)', 'number', { step: 0.5, help: '0.5 – 1440 minutes' }],
    ['display_method', 'Screen power method', 'select', { opts: [['auto', 'Auto-detect'], ['wlr-randr', 'Wayland: wlr-randr'], ['wlopm', 'Wayland: wlopm'], ['xset', 'X11: xset dpms'], ['vcgencmd', 'vcgencmd (legacy)'], ['backlight', 'Backlight sysfs'], ['none', 'None (never blank / relay only)']] }],
    ['display_output', 'Output name', 'text', { help: 'e.g. HDMI-A-1 — blank = all outputs' }],
    ['panel_relay_gpio', 'Panel power relay GPIO (BCM, 0 = none)', 'number', { step: 1, min: 0, max: 27, help: 'Optional: a relay / transistor that cuts the panel supply when asleep. Suggested 26 (physical pin 37)' }],
    ['panel_relay_active_low', 'Relay is active-low', 'checkbox', {}],
    ['panel_relay_boot_seconds', 'Panel boot wait (s)', 'number', { step: 0.5, help: 'Pause after power returns before the screen is unblanked' }],
  ]],
];
const SCHEMA_IDS = new Set(SCHEMA.flatMap(([, f]) => f.map(x => x[0])));
const form = document.getElementById('form'), msg = document.getElementById('msg');
const get = (o, p) => p.split('.').reduce((a, k) => a && a[k], o);
function build(cfg) {
  form.innerHTML = '';
  for (const [title, fields] of SCHEMA) {
    const fs = document.createElement('fieldset'); fs.innerHTML = '<legend>' + title + '</legend>'; fs.id = slug(title);
    for (const [key, label, type, o] of fields) {
      const row = document.createElement('div'); row.className = 'f';
      const lab = document.createElement('label'); lab.htmlFor = key; lab.innerHTML = label + (o.help ? '<small>' + o.help + '</small>' : '');
      let el;
      if (type === 'select') { el = document.createElement('select'); for (const [v, t] of o.opts) el.add(new Option(t, v)); }
      else if (type === 'lines') { el = document.createElement('textarea'); el.rows = 3; }
      else { el = document.createElement('input'); el.type = type; if (o.step) el.step = o.step; if (o.min != null) el.min = o.min; if (o.max != null) el.max = o.max; }
      el.id = el.name = key;
      const v = get(cfg, key);
      if (type === 'checkbox') el.checked = !!v; else el.value = type === 'lines' ? (v || []).join('\n') : v;
      row.append(lab, el); fs.append(row);
    }
    form.append(fs);
  }
  buildLocations();
  const t = document.createElement('fieldset'); t.innerHTML = '<legend>Tools</legend><div class="row"><button type="button" class="ghost" data-d="off">Screen off (test)</button><button type="button" class="ghost" data-d="on">Screen on</button></div>';
  t.querySelectorAll('button').forEach(b => b.onclick = () => fetch('/api/display/' + b.dataset.d, { method: 'POST' }).then(r => r.json()).then(j => flash(j.ok ? 'Display ' + b.dataset.d : 'No display method worked', j.ok)));
  form.append(t);
  const u = document.createElement('fieldset');
  u.innerHTML = '<legend>Software</legend><div class="row"><button type="button" id="upd">Pull changes &amp; restart</button><span id="upd-msg" style="align-self:center"></span></div><pre id="upd-log" style="white-space:pre-wrap;color:var(--dim);font-size:12px;margin:0 0 12px"></pre>';
  u.querySelector('#upd').onclick = runUpdate;
  form.append(u);
  buildWifi();
  document.getElementById('nav').innerHTML = [...form.querySelectorAll('fieldset')].map(f => '<a href="#' + f.id + '">' + f.querySelector('legend').textContent.replace(/ & .*/, '') + '</a>').join('');
  baseline = JSON.stringify(collect()); setDirty();
}
const slug = (t) => 's-' + t.toLowerCase().replace(/[^a-z0-9]+/g, '-');
let baseline = '';
function setDirty() {
  const d = JSON.stringify(collect()) !== baseline;
  document.getElementById('save').disabled = !d;
  if (d) { msg.textContent = 'Unsaved changes'; msg.className = 'dirty'; } else if (msg.className === 'dirty') { msg.textContent = ''; msg.className = ''; }
  return d;
}
form.addEventListener('input', (e) => { if (SCHEMA_IDS.has(e.target.id)) setDirty(); });
form.addEventListener('change', (e) => { if (SCHEMA_IDS.has(e.target.id)) setDirty(); });
window.addEventListener('beforeunload', (e) => { if (baseline && setDirty()) e.preventDefault(); });
window.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (!document.getElementById('save').disabled) document.getElementById('save').click(); } });

/* ---------------- Saved locations ---------------- */
function buildLocations() {
  const fs = document.createElement('fieldset');
  fs.innerHTML = '<legend>Saved locations</legend><div id="loc-body"><p style="color:var(--dim)">Loading…</p></div>';
  form.append(fs);
  refreshLocations();
}
async function locPost(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { flash(j.detail || 'Failed', false); return null; }
  return j;
}
async function refreshLocations() {
  const body = document.getElementById('loc-body');
  const j = await (await fetch('/api/locations', { cache: 'no-store' })).json();
  body.innerHTML =
    '<p style="color:var(--dim);font-size:12px">Hold the encoder button for ' + (j.hold_seconds ? j.hold_seconds + ' s' : '(disabled)') + ' to jump to the next location in this list. Each location stores the latitude, longitude, elevation and range from the Location section above.</p>' +
    '<div id="loc-list">' + (j.locations.length ? j.locations.map(l =>
      '<div class="row" style="align-items:center;margin:6px 0"><span style="flex:1"><b>' + esc(l.name) + '</b>' + (l.name === j.current ? ' <small class="ok">● active</small>' : '') +
      '<small style="display:block;color:var(--dim)">' + l.home_lat.toFixed(4) + ', ' + l.home_lon.toFixed(4) + ' · ' + l.range_km + ' km</small></span>' +
      (l.name === j.current ? '' : '<button type="button" class="ghost" data-use="' + esc(l.name) + '">Use</button>') +
      '<button type="button" class="ghost" data-del="' + esc(l.name) + '">Delete</button></div>').join('') : '<p style="color:var(--dim)">none saved yet</p>') + '</div>' +
    '<div class="f"><label for="loc-name">Save the current location as<small>press Save first if you changed the coordinates above</small></label><input id="loc-name" maxlength="40" placeholder="e.g. Home, Parents’ house"></div>' +
    '<div class="row"><button type="button" id="loc-save">Save location</button></div>';
  document.getElementById('loc-save').onclick = async () => {
    const name = document.getElementById('loc-name').value.trim();
    if (!name) { flash('Give the location a name', false); return; }
    if (await locPost('/api/locations', { name })) { flash('Saved “' + name + '” ✓'); refreshLocations(); }
  };
  body.querySelectorAll('[data-use]').forEach(b => b.onclick = async () => {
    if (await locPost('/api/locations/use', { name: b.dataset.use })) { flash('Now using “' + b.dataset.use + '” ✓'); load(); }
  });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (confirm('Delete saved location “' + b.dataset.del + '”?') && await locPost('/api/locations/delete', { name: b.dataset.del })) refreshLocations();
  });
}

/* ---------------- Wi-Fi ---------------- */
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const bars = (n) => n > 75 ? '▂▄▆█' : n > 50 ? '▂▄▆' : n > 25 ? '▂▄' : '▂';
function buildWifi() {
  const fs = document.createElement('fieldset');
  fs.innerHTML = '<legend>Wi-Fi</legend><div id="wf-body"><p style="color:var(--dim)">Loading…</p></div>';
  form.append(fs);
  refreshWifi();
}
async function refreshWifi() {
  const body = document.getElementById('wf-body');
  const r = await fetch('/api/wifi', { cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { body.innerHTML = '<p style="color:var(--dim)">' + esc(j.detail || 'Wi-Fi management unavailable') + '</p>'; return; }
  const p = j.progress || {};
  body.innerHTML =
    '<p><b>' + (j.connection ? 'Connected to ' + esc(j.connection) : 'Not connected') + '</b>' + (j.ip ? ' · ' + esc(j.ip) : '') + '</p>' +
    '<div class="row"><button type="button" class="ghost" id="wf-scan">Scan for networks</button></div>' +
    '<div id="wf-list"></div>' +
    '<div class="f"><label for="wf-ssid">Network name (SSID)</label><input id="wf-ssid" placeholder="choose from the list or type a hidden network"></div>' +
    '<div class="f"><label for="wf-pw">Password<small>blank for open networks</small></label><input id="wf-pw" type="password" autocomplete="off"></div>' +
    '<div class="f"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="wf-hidden" style="width:auto"> Hidden network (SSID not broadcast)</label></div>' +
    '<div class="row"><button type="button" id="wf-join">Connect now</button><button type="button" class="ghost" id="wf-add">Save for later</button><span id="wf-msg" style="align-self:center"></span></div>' +
    '<p style="color:var(--dim);font-size:12px"><b>Save for later</b> stores a network you can’t reach from here (e.g. the place you’re posting the Pi to). It won’t switch networks now, and the Pi joins it automatically when it’s in range.</p>' +
    '<p style="color:var(--dim);font-size:12px">This page may drop while the Pi switches network. If the new network doesn’t work within about a minute the Pi reverts to the previous one automatically.</p>' +
    '<label style="color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em">Saved networks</label>' +
    '<div id="wf-saved">' + (j.saved.length ? j.saved.map(s => '<div class="row" style="align-items:center;margin:6px 0"><span style="flex:1">' + esc(s.name) + (s.active ? ' <small class="ok">● active</small>' : '') + '</span>' + (s.active ? '' : '<button type="button" class="ghost" data-forget="' + esc(s.name) + '">Forget</button>') + '</div>').join('') : '<p style="color:var(--dim)">none</p>') + '</div>';
  document.getElementById('wf-scan').onclick = scanWifi;
  document.getElementById('wf-join').onclick = joinWifi;
  document.getElementById('wf-add').onclick = saveWifi;
  body.querySelectorAll('[data-forget]').forEach(b => b.onclick = async () => {
    const rr = await fetch('/api/wifi/forget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: b.dataset.forget }) });
    if (!rr.ok) flash((await rr.json()).detail, false); refreshWifi();
  });
  if (p.state === 'connecting') pollWifi();
}
async function scanWifi() {
  const list = document.getElementById('wf-list'), btn = document.getElementById('wf-scan');
  btn.disabled = true; list.innerHTML = '<p style="color:var(--dim)">Scanning…</p>';
  try {
    const j = await (await fetch('/api/wifi/scan', { method: 'POST' })).json();
    list.innerHTML = (j.networks || []).map(n => '<div class="row" style="align-items:center;margin:4px 0;cursor:pointer" data-ssid="' + esc(n.ssid) + '"><span style="flex:1">' + esc(n.ssid) + (n.active ? ' <small class="ok">● connected</small>' : '') + '</span><span style="font-family:monospace;color:var(--cyan)">' + bars(n.signal) + '</span><span>' + (n.secure ? '🔒' : '') + '</span></div>').join('') || '<p style="color:var(--dim)">No networks found</p>';
    list.querySelectorAll('[data-ssid]').forEach(el => el.onclick = () => { document.getElementById('wf-ssid').value = el.dataset.ssid; document.getElementById('wf-pw').focus(); });
  } catch (e) { list.innerHTML = '<p class="err">Scan failed</p>'; }
  btn.disabled = false;
}
async function joinWifi() {
  const ssid = document.getElementById('wf-ssid').value.trim(), pw = document.getElementById('wf-pw').value, msgEl = document.getElementById('wf-msg');
  if (!ssid) { msgEl.textContent = 'Enter a network name'; msgEl.className = 'err'; return; }
  const r = await fetch('/api/wifi/connect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ssid, password: pw, hidden: document.getElementById('wf-hidden').checked }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { msgEl.textContent = j.detail || 'Failed'; msgEl.className = 'err'; return; }
  document.getElementById('wf-pw').value = '';
  pollWifi();
}
async function saveWifi() {
  const ssid = document.getElementById('wf-ssid').value.trim(), pw = document.getElementById('wf-pw').value, msgEl = document.getElementById('wf-msg');
  if (!ssid) { msgEl.textContent = 'Enter a network name'; msgEl.className = 'err'; return; }
  const r = await fetch('/api/wifi/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ssid, password: pw, hidden: document.getElementById('wf-hidden').checked }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { msgEl.textContent = j.detail || 'Failed'; msgEl.className = 'err'; return; }
  document.getElementById('wf-pw').value = '';
  await refreshWifi();
  const m = document.getElementById('wf-msg'); if (m) { m.textContent = 'Saved “' + ssid + '” - the Pi will join it when it’s in range'; m.className = 'ok'; }
}
async function pollWifi() {
  const msgEl = () => document.getElementById('wf-msg');
  let down = 0;
  for (let i = 0; i < 60; i++) {                        // ~2 min; the page itself may lose connection meanwhile
    if (msgEl()) { msgEl().textContent = 'Connecting…'; msgEl().className = ''; }
    await new Promise(r => setTimeout(r, 2000));
    try {
      const r = await fetch('/api/wifi', { cache: 'no-store' }); if (!r.ok) return;
      const p = (await r.json()).progress; down = 0;
      if (p.state === 'ok' || p.state === 'failed') { await refreshWifi(); const m = msgEl(); if (m) { m.textContent = p.detail; m.className = p.state === 'ok' ? 'ok' : 'err'; } return; }
    } catch (e) { if (++down > 3 && msgEl()) msgEl().textContent = 'Connection lost - if the Pi joined a new network, find its new address (try http://<hostname>.local:5000/settings)'; }
  }
}
async function runUpdate() {
  const btn = document.getElementById('upd'), msgEl = document.getElementById('upd-msg'), logEl = document.getElementById('upd-log');
  btn.disabled = true; msgEl.textContent = 'Checking for updates…'; msgEl.className = '';
  let startVer = null;
  try {
    const r = await fetch('/api/update', { method: 'POST' }); const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.status);
    startVer = j.version;
  } catch (e) { msgEl.textContent = 'Could not start: ' + e.message; msgEl.className = 'err'; btn.disabled = false; return; }
  let restarted = false;
  for (let i = 0; i < 90; i++) {                       // up to ~3 min (pip installs can be slow)
    await new Promise(r => setTimeout(r, 2000));
    try {
      const s = await (await fetch('/api/update/status', { cache: 'no-store' })).json();
      if (restarted || (s.version && s.version !== startVer)) { msgEl.textContent = 'Updated ✓ now running ' + s.version; msgEl.className = 'ok'; btn.disabled = false; return; }
      logEl.textContent = s.log;
      if (!s.running) {
        if (/already up to date/.test(s.log)) msgEl.textContent = 'Already up to date';
        else if (s.exit_code) msgEl.textContent = 'Update failed (see log)';
        else { msgEl.textContent = 'Restarting…'; continue; }
        msgEl.className = s.exit_code ? 'err' : 'ok'; btn.disabled = false; return;
      }
    } catch (e) { msgEl.textContent = 'Restarting…'; restarted = true; }   // server is down mid-restart
  }
  msgEl.textContent = 'Timed out - check journalctl -u plane-tracker-update'; msgEl.className = 'err'; btn.disabled = false;
}
function flash(t, ok = true) { msg.textContent = t; msg.className = ok ? 'ok' : 'err'; clearTimeout(flash.t); flash.t = setTimeout(() => { msg.textContent = ''; msg.className = ''; setDirty(); }, 4000); }
async function load() { build(await (await fetch('/api/config')).json()); }
function collect() {
  const patch = {};
  for (const [, fields] of SCHEMA) for (const [key, , type] of fields) {
    const el = document.getElementById(key);
    const v = type === 'checkbox' ? el.checked : type === 'lines' ? el.value.split('\n').map(s => s.trim()).filter(Boolean) : el.value;
    const parts = key.split('.'); let o = patch;
    parts.slice(0, -1).forEach(k => o = (o[k] = o[k] || {})); o[parts.at(-1)] = v;
  }
  return patch;
}
document.getElementById('save').onclick = async (e) => {
  e.preventDefault();
  const btn = e.currentTarget; btn.disabled = true;
  let r, j;
  try {
    r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(collect()) });
    j = await r.json();
  } catch (err) { flash('Could not reach the Pi', false); setDirty(); return; }
  if (r.ok) { flash(j.changed.length ? 'Saved ✓ (' + j.changed.length + ' changed)' : 'Nothing changed'); build(j.config); } else { flash(j.detail || 'Error', false); setDirty(); }
};
document.getElementById('reload').onclick = () => { if (!setDirty() || confirm('Discard unsaved changes?')) load(); };
document.getElementById('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.reload(); };
fetch('/api/auth').then(r => r.json()).then(a => {
  if (!a.required) { document.getElementById('logout').hidden = true; document.querySelector('p.lead').insertAdjacentHTML('afterend', '<p style="background:#3a2a05;border:1px solid var(--amber);border-radius:8px;padding:10px 12px;font-size:14px">⚠ No password set — anyone on your network can change these settings, and Wi-Fi management is disabled. Add <code>SETTINGS_PASSWORD=…</code> to the <code>.env</code> file and restart the service.</p>'); }
});
load();
</script>
